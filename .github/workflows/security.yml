# Static security analysis of the source (CodeQL) and a review of dependency
# changes in pull requests. Advisory: neither is a required check, because both
# depend on repository features (code scanning, the dependency graph) that
# the repository settings decide; see docs/REPOSITORY-SETTINGS.md, "Security
# features". Their findings appear in the run and under Security. Without the
# dependency graph the review is skipped with a notice, not failed.
name: Security

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    # weekly, Monday 04:23 UTC: new CodeQL queries find old code too
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # to read the source
      security-events: write # to upload the results to code scanning (this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # the TypeScript source and the build and test scripts; no build is needed
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - dist
              - src/generated
              - node_modules
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The review needs the repository's dependency graph (Settings → Advanced Security). Without it the
      # job says so and passes, rather than failing every pull request over a setting
      # (docs/REPOSITORY-SETTINGS.md, "Security features").
      - name: Is the dependency graph enabled?
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/dependency-graph/sbom" --silent 2> graph-error.txt; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            why="$(tr -s '[:space:]' ' ' < graph-error.txt)"
            echo "::notice title=Dependency review skipped::The dependency graph is not available for this repository (${why}). Enable it under Settings → Advanced Security to review dependency changes."
          fi
      # changed dependencies with known vulnerabilities or a license other than these fail the review
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD
          comment-summary-in-pr: never
