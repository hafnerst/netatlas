# Verifies and packages a release from a tag the maintainer created, and
# attaches the assets to a DRAFT GitHub release. It never creates or moves a
# tag, never chooses a version, never merges anything and never publishes:
# the maintainer reviews the draft and presses "Publish release".
#
# Run it by hand: Actions → Release → Run workflow, with the tag (vX.Y.Z) that
# is on the release merge commit in main. The steps are in CONTRIBUTING.md,
# "Releasing"; the environment that guards the publishing job is in
# docs/REPOSITORY-SETTINGS.md.
#
# Re-running is safe: an asset that is already attached with the same content
# is left alone; one with different content is never replaced (the run fails
# and says so); a release that is already published gets missing assets only.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The existing release tag, e.g. v0.1.4 (on the release merge commit in main)'
        required: true
        type: string

permissions:
  contents: read

# one run per tag at a time, and never cancelled by another run (CI's cancellation does not reach it)
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CHROME_VERSION: '155.0.8059.84'
  NETATLAS_REQUIRE_BROWSER: '1'

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      - name: The tag is vX.Y.Z or vX.Y.Z-pre
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$TAG\" is not a release tag (vX.Y.Z or vX.Y.Z-pre)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          # the history of main too: the tagged commit must be on it
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::the tagged commit $(git rev-parse HEAD) is not on main"; exit 1; }
          echo "tagged commit $(git rev-parse HEAD), on main"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # no cache: a release is built from a fresh install
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - name: Committed generated files are current (nothing regenerated yet)
        run: npm run check:dist
      - name: Repeated builds are identical and change no committed file
        run: npm run check:repro
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
          install-dependencies: true
      # Ubuntu 24.04 forbids the unprivileged user namespaces that Chrome's sandbox needs: allow them for
      # this job, so that the browser runs with its sandbox (rather than with --no-sandbox)
      - name: Let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Every test suite
        run: node scripts/run-tests.mjs all --strict
        env:
          NETATLAS_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
      - name: Package (version, tag, CHANGELOG, test payload, size; checksums and provenance)
        id: package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-check.mjs --tag "$TAG" --out release
          (cd release && sha256sum -c SHA256SUMS)
          if printf '%s' "$TAG" | grep -q -- -; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### Release assets for $TAG"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: release-verification-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Attach to a draft release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # the environment's required reviewer (the maintainer) approves this job before it runs
    environment: release
    permissions:
      contents: write # to create the draft release and attach its assets
      id-token: write # to sign the build provenance attestation (OIDC)
      attestations: write # to store that attestation
    steps:
      - name: Started by the repository owner
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::a release is attached only when its owner $OWNER starts the run (this one: $ACTOR)"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Checksums
        run: cd release && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/netatlas.html
      - name: Draft release with the assets (nothing is replaced)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          assets="netatlas.html SHA256SUMS provenance.json"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            flags=(--draft --verify-tag --title "NetAtlas $TAG" --notes-file release/release-notes.md)
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" release/netatlas.html release/SHA256SUMS release/provenance.json
            echo "created the draft release $TAG with $assets; review and publish it on GitHub"
            exit 0
          fi
          mkdir -p existing
          bad=0
          for a in $assets; do
            if gh release download "$TAG" --pattern "$a" --dir existing > /dev/null 2>&1; then
              if cmp -s "existing/$a" "release/$a"; then
                echo "$a is already attached, unchanged"
              else
                echo "::error::$a is already attached to $TAG with other content; it is not replaced (delete that asset by hand to replace it)"
                bad=1
              fi
            else
              gh release upload "$TAG" "release/$a"
              echo "attached $a"
            fi
          done
          exit $bad
