<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The fonts of CI's browser jobs on Linux (copied to ~/.config/fontconfig/ by the workflows). Without
  it, system-ui and sans-serif resolve to DejaVu Sans on the runners, wider than the fonts the label
  sizes are estimated for (src/layout/text.ts; Segoe UI, Roboto, Arial), and labels leave their boxes
  (docs/LIMITATIONS.md). Liberation Sans has Arial's metrics and comes with Chrome's dependencies.
-->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
