# netatlas example: a model created with "New" in the editor and built up
# with the editor operations (generated by scripts/make-editor-examples.mjs).
netatlas: 1
title: "Lab: two edge routers"
description: "Created in the netatlas editor: loopbacks, one cable, an IP network, iBGP and a GRE tunnel between loopbacks."
devices:
  - id: edge-a
    type: router
    router_id: lo0
    interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.255.0.1/32]}
      - {id: lo1, type: loopback, label: BGP source (IPv6), ip: [2001:db8:ffff::a/128]}
      - {id: ge-0/0/0, ip: [192.0.2.1/31]}
  - id: edge-b
    label: Edge B
    type: router
    router_id: lo0
    interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.255.0.2/32, 2001:db8:ffff::2/128]}
      - {id: lo1, type: loopback, label: BGP source (IPv6), ip: [2001:db8:ffff::b/128]}
      - {id: ge-0/0/0, ip: [192.0.2.0/31]}
links:
  - {id: cable-1, a: edge-a:ge-0/0/0, b: edge-b:ge-0/0/0, medium: fiber, speed: 10G, cable: LC-LC OM4 3m}
networks:
  - id: net-core
    label: Core link
    cidr: 192.0.2.0/31
relations:
  - id: ibgp-v6
    protocol: ibgp
    endpoints: [edge-a:lo1, edge-b:lo1]
    over: cable-1
    attrs:
      asn: 65000
      address-family: [ipv6-unicast, evpn]
  - id: gre-lab
    protocol: gre
    endpoints: [edge-a:lo0, edge-b:lo0]
    over: cable-1
    attrs:
      key: 100
      keepalive:
        interval: 10s
        retries: 3

layout:
  physical:
    edge-a: [75, 27]
    edge-b: [75, 161]
  logical:
    edge-a: [70, 25]
    edge-b: [70, 185]
    net-core: [-110, 105]
