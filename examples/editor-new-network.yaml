# netatlas example: a model created with "New" in the editor and built up
# with the editor operations (generated by scripts/make-editor-examples.mjs).
netatlas: 1
title: "Lab: two edge routers"
description: "Created in the netatlas editor: loopbacks, ports with logical and tunnel children, one cable, IP networks, iBGP and a GRE tunnel between loopbacks."
devices:
  - id: edge-a
    type: router
    loopbacks:
      - {id: lo0, label: Router ID, ip: [10.255.0.1/32]}
      - {id: lo1, label: BGP source (IPv6), ip: [2001:db8:ffff::a/128]}
    interfaces:
      - id: ge-0/0/0
        ip: [192.0.2.1/31]
        children:
          - {id: ge-0/0/0.100, type: logical, label: Management, ip: [10.100.0.1/24]}
          - {id: gr-0/0/0.1, type: tunnel, ip: [172.16.0.1/30]}
  - id: edge-b
    label: Edge B
    type: router
    loopbacks:
      - {id: lo0, label: Router ID, ip: [10.255.0.2/32, 2001:db8:ffff::2/128]}
      - {id: lo1, label: BGP source (IPv6), ip: [2001:db8:ffff::b/128]}
    interfaces:
      - id: ge-0/0/0
        ip: [192.0.2.0/31]
        children:
          - {id: ge-0/0/0.100, type: logical, label: Management, ip: [10.100.0.2/24]}
          - {id: gr-0/0/0.1, type: tunnel, ip: [172.16.0.2/30]}
links:
  - {id: cable-1, a: edge-a:ge-0/0/0, b: edge-b:ge-0/0/0, medium: fiber, speed: 10G, cable: LC-LC OM4 3m}
networks:
  - id: net-core
    label: Core link
    cidr: 192.0.2.0/31
  - id: net-mgmt
    label: Management
    cidr: 10.100.0.0/24
    vlan: 100
  - id: net-loopbacks
    label: Router loopbacks
    cidr: 10.255.0.0/24
relations:
  - id: ibgp-v6
    protocol: ibgp
    endpoints: [edge-a:lo1, edge-b:lo1]
    over: cable-1
    attrs:
      asn: 65000
      address-family: [ipv6-unicast, evpn]
  - id: gre-lab
    protocol: gre
    endpoints: [edge-a:lo0, edge-b:lo0]
    over: cable-1
    attrs:
      key: 100
      keepalive:
        interval: 10s
        retries: 3

layout:
  physical:
    edge-a: [75, 27]
    edge-b: [384, 27]
  logical:
    edge-a: [88, 328]
    edge-b: [424, 282]
    net-core: [106, 576]
    net-loopbacks: [507, 486]
    net-mgmt: [191, 21]
