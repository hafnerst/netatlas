# netatlas example: a three-tier campus with controller-managed Wi-Fi and
# the services that run it.
#
# Three tiers by role: the core (a Layer 3 switch that routes the VLANs),
# the distribution and two access switches; Auto-arrange puts each in its
# row. The two access points are controller-managed: their controller, wlc
# (a System of purpose Host with the Wireless controller service), lists
# them, and each names it — the simulation keeps a CAPWAP control channel
# between them. Their Wi-Fi networks are bridged locally: Staff to VLAN 10
# (802.1X against the RADIUS server), Guest to VLAN 20; their management
# addresses are in VLAN 99.
#
# srv runs the campus's services: DHCP for the clients (through the core's
# relays), DNS, NTP (stratum 3; the core takes its time from it), AAA (RADIUS for the access points'
# 802.1X), a syslog collector for the network devices and monitoring
# (it pings and polls them). Secrets are placeholders, never secrets.
#
# Simulate ▾ → Start simulation…: the clients' leases through the relays,
# CAPWAP keepalives, RADIUS requests, syslog messages and SNMP polls.
netatlas: 1
title: Enterprise campus — three tiers and controller-managed Wi-Fi
description: |
  Core, distribution and access switches by role; two controller-managed
  access points with Staff and Guest networks on VLANs; a services server
  with DHCP, DNS, NTP, AAA, syslog and monitoring.

groups:
  - id: campus
    label: Campus
    kind: campus
  - id: dc
    label: Server room
    kind: room
    parent: campus
  - id: bldg-a
    label: Building A
    kind: building
    parent: campus

networks:
  - {id: staff, label: Staff, cidr: 10.20.10.0/24, vlan: 10}
  - {id: guest, label: Guest, cidr: 10.20.20.0/24, vlan: 20}
  - {id: servers, label: Servers, cidr: 10.20.30.0/24, vlan: 30}
  - {id: mgmt, label: Management, cidr: 10.20.99.0/24, vlan: 99}

devices:
  - id: core1
    type: switch
    layer3: true
    role: core
    group: dc
    services:
      ntp:
        upstreams: [10.20.30.10]
    igmp_mld_snooping: {10: enabled, 20: enabled, 30: enabled, 99: enabled}
    interfaces:
      - {id: d1, vlans: [10, 20, 99]}
      - {id: s1, vlans: 30}
      - {id: s2, vlans: 99}
    logical_interfaces:
      - {id: Vlan10, type: virtual, vlan: 10, ip: 10.20.10.1/24, dhcp_relay: [10.20.30.10]}
      - {id: Vlan20, type: virtual, vlan: 20, ip: 10.20.20.1/24, dhcp_relay: [10.20.30.10]}
      - {id: Vlan30, type: virtual, vlan: 30, ip: 10.20.30.1/24}
      - {id: Vlan99, type: virtual, vlan: 99, ip: 10.20.99.1/24}
  - id: dist1
    type: switch
    role: distribution
    group: dc
    igmp_mld_snooping: {10: enabled, 20: enabled, 99: enabled}
    interfaces:
      - {id: up, vlans: [10, 20, 99]}
      - {id: a1, vlans: [10, 20, 99]}
      - {id: a2, vlans: [10, 20, 99]}
  - id: acc1
    type: switch
    role: access
    group: bldg-a
    igmp_mld_snooping: {10: enabled, 20: enabled, 99: enabled}
    interfaces:
      - {id: up, vlans: [10, 20, 99]}
      - {id: ap, vlans: [10, 20, 99]}
  - id: acc2
    type: switch
    role: access
    group: bldg-a
    igmp_mld_snooping: {10: enabled, 20: enabled, 99: enabled}
    interfaces:
      - {id: up, vlans: [10, 20, 99]}
      - {id: ap, vlans: [10, 20, 99]}
  - id: ap1
    type: ap
    mode: controller
    group: bldg-a
    services:
      wireless:
        controller: wlc
        networks:
          - {id: staff, ssid: Campus, vlan: 10, radio: radio0, security: wpa3_enterprise}
          - {id: guest, ssid: Campus-Guest, vlan: 20, radio: radio0, security: wpa2_psk, passphrase: "<guest-psk>"}
    interfaces:
      - {id: eth0, vlans: [10, 20, 99]}
      - {id: radio0}
    logical_interfaces:
      - {id: mgmt, type: virtual, vlan: 99, ip: 10.20.99.11/24}
    routes:
      - {prefix: 0.0.0.0/0, via: 10.20.99.1, name: default gateway}
  - id: ap2
    type: ap
    mode: controller
    group: bldg-a
    services:
      wireless:
        controller: wlc
        networks:
          - {id: staff, ssid: Campus, vlan: 10, radio: radio0, security: wpa3_enterprise}
          - {id: guest, ssid: Campus-Guest, vlan: 20, radio: radio0, security: wpa2_psk, passphrase: "<guest-psk>"}
    interfaces:
      - {id: eth0, vlans: [10, 20, 99]}
      - {id: radio0}
    logical_interfaces:
      - {id: mgmt, type: virtual, vlan: 99, ip: 10.20.99.12/24}
    routes:
      - {prefix: 0.0.0.0/0, via: 10.20.99.1, name: default gateway}
  - id: wlc
    label: wlc (wireless controller)
    type: system
    kind: other
    kind_label: Wireless LAN controller
    role: management
    purpose: host
    icon: controller
    group: dc
    services:
      wireless_controller:
        aps: [ap1, ap2]
    interfaces:
      - {id: eth0, ip: 10.20.99.5/24}
    routes:
      - {prefix: 0.0.0.0/0, via: 10.20.99.1, name: default gateway}
  - id: srv
    label: srv (campus services)
    type: server
    group: dc
    services:
      dhcp:
        scopes:
          - {network: staff, range: 10.20.10.100-10.20.10.199, gateway: 10.20.10.1, dns: [10.20.30.10]}
          - {network: guest, range: 10.20.20.100-10.20.20.199, gateway: 10.20.20.1, dns: [10.20.30.10]}
      dns:
        zones:
          - {name: campus.example}
      ntp:
        stratum: 3
      aaa:
        protocol: radius
        secret: "<radius-secret>"
        clients: [ap1, ap2, wlc]
      syslog:
        senders: [core1, wlc]
      monitoring:
        targets: [core1, ap1, ap2, wlc]
    interfaces:
      - {id: eth0, ip: 10.20.30.10/24}
    dns_names:
      - {name: srv.campus.example, interfaces: [eth0]}
    routes:
      - {prefix: 0.0.0.0/0, via: 10.20.30.1, name: default gateway}
  - id: laptop1
    type: endpoint
    kind: pc
    group: bldg-a
    simulation: {test_traffic: "on", test_targets: "srv.campus.example icmp", test_interval: 10}
    interfaces:
      - {id: wlan0, ipv4: dhcp}
  - id: laptop2
    type: endpoint
    kind: pc
    group: bldg-a
    interfaces:
      - {id: wlan0, ipv4: dhcp}
  - id: visitor
    type: endpoint
    kind: mobile
    group: bldg-a
    interfaces:
      - {id: wlan0, ipv4: dhcp}

links:
  - {id: l-core-dist, a: "core1:d1", b: "dist1:up", medium: fiber, speed: 10G}
  - {id: l-core-srv, a: "core1:s1", b: "srv:eth0", speed: 10G}
  - {id: l-core-wlc, a: "core1:s2", b: "wlc:eth0", speed: 1G}
  - {id: l-dist-acc1, a: "dist1:a1", b: "acc1:up", medium: fiber, speed: 10G}
  - {id: l-dist-acc2, a: "dist1:a2", b: "acc2:up", medium: fiber, speed: 10G}
  - {id: l-acc1-ap1, a: "acc1:ap", b: "ap1:eth0", speed: 1G}
  - {id: l-acc2-ap2, a: "acc2:ap", b: "ap2:eth0", speed: 1G}
  - {id: w-laptop1, a: "ap1:radio0", b: "laptop1:wlan0", medium: wireless, wireless_network: staff}
  - {id: w-visitor, a: "ap1:radio0", b: "visitor:wlan0", medium: wireless, wireless_network: guest}
  - {id: w-laptop2, a: "ap2:radio0", b: "laptop2:wlan0", medium: wireless, wireless_network: staff}
