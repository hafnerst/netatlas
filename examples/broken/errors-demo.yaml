# netatlas example: a file with mistakes, to show how errors are reported.
# Open it in netatlas: every problem is listed with its line number, the
# path of the offending value, the source line, and a suggestion.
netatlas: 1
title: Error reporting demo

devices:
  - id: r1
    typ: router                 # typo: "type"
    vendor: Acme                # not a device key (custom data goes under attrs)
    loopbacks:                  # not a device key: a loopback is a logical interface
      - {id: lo9, ip: 10.0.0.9/32}
    interfaces:
      - id: eth0
        children:               # not an interface key: interfaces are not nested
          - {id: tun9, type: tunnel}
    logical_interfaces:
      - {id: tun0, type: tunnel, source: eth7}              # r1 has no eth7
      - {id: bond0, type: virtual, members: [eth0, tun0]}   # a member is a physical interface
      - {id: lo0, type: loopback}                           # a loopback needs an address
      - {id: x0, type: subinterface}                        # loopback, virtual or tunnel
  - id: r2
    interfaces: [eth0, eth1]

links:
  - {id: l1, a: "r1:eth1", b: "r2:eth0"}   # r1 has no eth1
  - {id: l2, a: "r1:tun0", b: "r2:eth1"}   # a tunnel interface is not a physical port

relations:
  - id: gre1
    protocol: gre
    category: tunel                        # typo: "tunnel"
    endpoints: [r1, r2]
    over: l3                               # no such link
