# netatlas example: examples/metro-ring.yaml after Auto-arrange (both views) and export
# (generated by scripts/make-editor-examples.mjs). The positions are in the
# "layout" section at the end; the network itself is unchanged.
# netatlas example: metro ring (for Auto-arrange)
#
# Six PE routers in three POPs on a fibre ring, each with IPv4/IPv6
# loopbacks used as router IDs and as iBGP / RSVP-TE endpoints. The logical
# layer is dense on purpose: an OSPF area, LDP on every ring link, a full
# iBGP mesh between loopbacks (15 sessions), two RSVP-TE tunnels, an L3VPN
# overlay and customer eBGP. An out-of-band management network forms a
# separate, disconnected component, and a spare router is not connected at
# all. There is no "layout" section: open it and use Auto-arrange.
netatlas: 1
title: Metro ring MR-1

groups:
  - {id: pop-north, label: POP North, kind: site}
  - {id: pop-east, label: POP East, kind: site}
  - {id: pop-south, label: POP South, kind: site}
  - {id: oob, label: Out-of-band management, kind: zone}
  - {id: cust-a, label: Customer A, kind: external}

devices:
  - id: pe1
    type: router
    group: pop-north
    interfaces:
      - {id: et1, ip: 10.1.12.1/31}
      - {id: et2, ip: 10.1.16.1/31}
      - {id: et3, ip: 192.0.2.1/30, vrf: CUST-A}
      - {id: et4}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.0.0.1/32, 2001:db8:0:ffff::1/128]}
  - id: pe2
    type: router
    group: pop-north
    interfaces:
      - {id: et1, ip: 10.1.12.0/31}
      - {id: et2, ip: 10.1.23.0/31}
      - {id: et4}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.0.0.2/32, 2001:db8:0:ffff::2/128]}
  - id: pe3
    type: router
    group: pop-east
    interfaces:
      - {id: et1, ip: 10.1.23.1/31}
      - {id: et2, ip: 10.1.34.0/31}
      - {id: et4}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.0.0.3/32, 2001:db8:0:ffff::3/128]}
      - {id: lo1, type: loopback, label: VPN next-hop, ip: [10.0.1.3/32]}
  - id: pe4
    type: router
    group: pop-east
    interfaces:
      - {id: et1, ip: 10.1.34.1/31}
      - {id: et2, ip: 10.1.45.0/31}
      - {id: et4}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.0.0.4/32, 2001:db8:0:ffff::4/128]}
  - id: pe5
    type: router
    group: pop-south
    interfaces:
      - {id: et1, ip: 10.1.45.1/31}
      - {id: et2, ip: 10.1.56.0/31}
      - {id: et3, ip: 192.0.2.5/30, vrf: CUST-A}
      - {id: et4}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.0.0.5/32, 2001:db8:0:ffff::5/128]}
      - {id: lo1, type: loopback, label: VPN next-hop, ip: [10.0.1.5/32]}
  - id: pe6
    type: router
    group: pop-south
    interfaces:
      - {id: et1, ip: 10.1.56.1/31}
      - {id: et2, ip: 10.1.16.0/31}
      - {id: et4}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.0.0.6/32, 2001:db8:0:ffff::6/128]}
  - id: ce-a1
    label: Customer A — HQ
    type: router
    group: cust-a
    interfaces:
      - {id: ge0, ip: 192.0.2.2/30}
  - id: ce-a2
    label: Customer A — Plant
    type: router
    group: cust-a
    interfaces:
      - {id: ge0, ip: 192.0.2.6/30}
  - id: oob-sw
    label: OOB switch
    type: switch
    group: oob
    interfaces:
      - {id: p1}
      - p2
      - p3
    logical_interfaces:
      - {id: vlan1, type: virtual, ip: 172.31.0.2/24}
  - id: oob-con1
    label: Console server 1
    type: system
    group: oob
    interfaces:
      - {id: eth0, ip: 172.31.0.11/24}
  - id: oob-con2
    label: Console server 2
    type: system
    group: oob
    interfaces:
      - {id: eth0, ip: 172.31.0.12/24}
  - id: oob-nms
    label: NMS collector
    type: server
    group: oob
    interfaces:
      - {id: eth0, ip: 172.31.0.20/24}
  - id: spare-pe
    label: Spare PE (not in service)
    type: router
    logical_interfaces:
      - {id: lo0, type: loopback, ip: [10.0.0.99/32]}

links:
  # the ring
  - {id: r12, a: "pe1:et1", b: "pe2:et1", medium: fiber, speed: 100G}
  - {id: r23, a: "pe2:et2", b: "pe3:et1", medium: fiber, speed: 100G}
  - {id: r34, a: "pe3:et2", b: "pe4:et1", medium: fiber, speed: 100G}
  - {id: r45, a: "pe4:et2", b: "pe5:et1", medium: fiber, speed: 100G}
  - {id: r56, a: "pe5:et2", b: "pe6:et1", medium: fiber, speed: 100G}
  - {id: r61, a: "pe6:et2", b: "pe1:et2", medium: fiber, speed: 100G}
  # intra-POP cross-connects
  - {id: x-north, a: "pe1:et4", b: "pe2:et4", medium: dac, speed: 100G, cable: DAC 1m}
  - {id: x-east, a: "pe3:et4", b: "pe4:et4", medium: dac, speed: 100G, cable: DAC 1m}
  - {id: x-south, a: "pe5:et4", b: "pe6:et4", medium: dac, speed: 100G, cable: DAC 1m}
  # customer access
  - {id: acc-a1, a: "pe1:et3", b: "ce-a1:ge0", medium: fiber, speed: 10G}
  - {id: acc-a2, a: "pe5:et3", b: "ce-a2:ge0", medium: fiber, speed: 10G}
  # out-of-band island (not connected to the ring)
  - {id: oob-1, a: "oob-sw:p1", b: "oob-con1:eth0", medium: copper}
  - {id: oob-2, a: "oob-sw:p2", b: "oob-con2:eth0", medium: copper}
  - {id: oob-3, a: "oob-sw:p3", b: "oob-nms:eth0", medium: copper}

networks:
  # members are derived from the addresses inside each prefix
  - id: cust-a-access
    label: Customer A access
    cidr: [192.0.2.0/30, 192.0.2.4/30]
    attrs: {vrf: CUST-A, rd: "65000:100", rt: "65000:100"}
  - id: oob-mgmt
    label: OOB management
    cidr: 172.31.0.0/24

relations:
  - id: ospf-core
    protocol: ospf
    label: area 0
    endpoints: [pe1, pe2, pe3, pe4, pe5, pe6]
  # LDP on every ring link
  - {id: ldp-12, protocol: ldp, endpoints: ["pe1:et1", "pe2:et1"], over: r12}
  - {id: ldp-23, protocol: ldp, endpoints: ["pe2:et2", "pe3:et1"], over: r23}
  - {id: ldp-34, protocol: ldp, endpoints: ["pe3:et2", "pe4:et1"], over: r34}
  - {id: ldp-45, protocol: ldp, endpoints: ["pe4:et2", "pe5:et1"], over: r45}
  - {id: ldp-56, protocol: ldp, endpoints: ["pe5:et2", "pe6:et1"], over: r56}
  - {id: ldp-61, protocol: ldp, endpoints: ["pe6:et2", "pe1:et2"], over: r61}
  # full iBGP mesh between loopbacks (15 sessions)
  - {id: ibgp-1-2, protocol: ibgp, endpoints: ["pe1:lo0", "pe2:lo0"]}
  - {id: ibgp-1-3, protocol: ibgp, endpoints: ["pe1:lo0", "pe3:lo0"]}
  - {id: ibgp-1-4, protocol: ibgp, endpoints: ["pe1:lo0", "pe4:lo0"]}
  - {id: ibgp-1-5, protocol: ibgp, endpoints: ["pe1:lo0", "pe5:lo0"]}
  - {id: ibgp-1-6, protocol: ibgp, endpoints: ["pe1:lo0", "pe6:lo0"]}
  - {id: ibgp-2-3, protocol: ibgp, endpoints: ["pe2:lo0", "pe3:lo0"]}
  - {id: ibgp-2-4, protocol: ibgp, endpoints: ["pe2:lo0", "pe4:lo0"]}
  - {id: ibgp-2-5, protocol: ibgp, endpoints: ["pe2:lo0", "pe5:lo0"]}
  - {id: ibgp-2-6, protocol: ibgp, endpoints: ["pe2:lo0", "pe6:lo0"]}
  - {id: ibgp-3-4, protocol: ibgp, endpoints: ["pe3:lo0", "pe4:lo0"]}
  - {id: ibgp-3-5, protocol: ibgp, endpoints: ["pe3:lo0", "pe5:lo0"]}
  - {id: ibgp-3-6, protocol: ibgp, endpoints: ["pe3:lo0", "pe6:lo0"]}
  - {id: ibgp-4-5, protocol: ibgp, endpoints: ["pe4:lo0", "pe5:lo0"]}
  - {id: ibgp-4-6, protocol: ibgp, endpoints: ["pe4:lo0", "pe6:lo0"]}
  - {id: ibgp-5-6, protocol: ibgp, endpoints: ["pe5:lo0", "pe6:lo0"]}
  # traffic-engineered tunnels between loopbacks, riding the ring
  - id: te-1-4
    protocol: rsvp-te
    label: primary north→east
    directed: true
    endpoints: ["pe1:lo0", "pe4:lo0"]
    over: [r12, r23, r34]
    attrs: {bandwidth: 40G, setup-priority: 3}
  - id: te-2-5
    protocol: rsvp-te
    label: primary north→south
    directed: true
    endpoints: ["pe2:lo0", "pe5:lo0"]
    over: [r61, r56, x-north]
    attrs: {bandwidth: 20G}
  # customer service
  - id: l3vpn-a
    protocol: l3vpn
    label: CUST-A
    endpoints: ["pe1:lo0", "pe3:lo1", "pe5:lo1"]
    network: cust-a-access
  - {id: ebgp-a1, protocol: ebgp, endpoints: ["pe1:et3", "ce-a1:ge0"], over: acc-a1, attrs: {peer-as: 64601}}
  - {id: ebgp-a2, protocol: ebgp, endpoints: ["pe5:et3", "ce-a2:ge0"], over: acc-a2, attrs: {peer-as: 64601}}
  # inside the OOB island
  - {id: syslog-oob, protocol: syslog, directed: true, endpoints: [oob-con1, "oob-nms:eth0"]}
  - {id: snmp-oob, protocol: snmp, directed: true, endpoints: [oob-nms, oob-sw]}

layout:
  physical:
    ce-a1: [114, 365]
    ce-a2: [372, 365]
    oob-con1: [400, 763]
    oob-con2: [647, 763]
    oob-nms: [887, 763]
    oob-sw: [640, 599]
    pe1: [116, 108]
    pe2: [377, 108]
    pe3: [627, 86]
    pe4: [889, 86]
    pe5: [642, 390]
    pe6: [904, 390]
    spare-pe: [1166, 27]
  logical:
    ce-a1: [567, 648]
    ce-a2: [596, 821]
    cust-a-access: [297, 751]
    l3vpn-a: [240, 189]
    oob-con1: [1546, 713]
    oob-con2: [1305, 233]
    oob-mgmt: [1515, 398]
    oob-nms: [1685, 236]
    oob-sw: [1605, 26]
    ospf-core: [758, 275]
    pe1: [659, 426]
    pe2: [790, 37]
    pe3: [435, 129]
    pe4: [1026, 231]
    pe5: [103, 532]
    pe6: [1015, 464]
    spare-pe: [114, 973]
