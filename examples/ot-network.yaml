# netatlas example: an OT cell behind a protocol gateway, watched through a
# TAP.
#
# The engineering workstation on the IT side reaches the cell's PLC through
# pgw, a System whose purpose is Layer 3 forwarder (it routes; its icon and
# its kind label say what it is: an industrial protocol gateway). A System
# always says what it does: host, Layer 2 or Layer 3 forwarder, inline,
# passive monitor, pass-through or external network.
#
# Between the gateway and the cell switch sits a network TAP: a System that
# is pass-through, with no IP stack. Its port pair net-a ↔ net-b carries the
# original traffic on unchanged; its monitor port mon gets a copy of what
# passes (port_pairs: copy) and sends nothing back. The copy goes to ids, an
# IDS/IPS in passive mode: it receives copies and never forwards anything.
#
# Applications: the PLC is an Endpoint (kind PLC) with three applications of
# its own, without becoming a Server. Its register access is a TCP listener on
# port 502, named "Modbus TCP": the name labels it, NetAtlas simulates TCP
# requests and answers, nothing of Modbus. The HMI's register polling is a TCP
# client of plc-1/registers. The PLC also publishes telemetry by MQTT to the
# broker on edge-1 (an MQTT broker service): its temperature and its pressure.
# The HMI's dashboard subscribes to plant/cell1/+/temperature (it gets the
# temperature, never the pressure); the engineering workstation's alarm log
# subscribes to plant/cell1/+/alarm, which nothing publishes: it receives
# nothing. Every MQTT message goes to the broker first; no IP multicast.
#
# Analyze ▾ → Trace path… from eng-ws to plc notes the TAP's copy; Simulate ▾
# → Start simulation… shows the copies arriving at the IDS while the
# original frames go on to the PLC. Network events → Start application starts
# an application: hmi-1's register polling, plc-1's telemetry, hmi-1's
# dashboard or eng-ws's alarm log (Show MQTT sessions on edge-1 lists the
# clients and their subscriptions).
netatlas: 2
title: OT cell — protocol gateway, TAP and passive IDS
description: |
  A PLC and an HMI behind a protocol gateway (a System, Layer 3 forwarder),
  with a pass-through TAP whose monitor port feeds a passive IDS; the PLC's
  applications (register access, telemetry by MQTT) and an MQTT broker.

groups:
  - id: it
    label: IT (engineering)
    kind: zone
  - id: cell
    label: OT cell 1
    kind: zone

devices:
  - id: eng-ws
    label: eng-ws (engineering)
    type: endpoint
    kind: pc
    group: it
    # (on the gateway's row: the IT side beside the cell, not under it)
    tier: 1
    simulation: {test_traffic: "on", test_targets: "10.71.0.10 icmp", test_interval: 10}
    services:
      applications:
        - {id: alarms, name: Alarm log, profile: mqtt_client, broker: edge, subscribe: [plant/cell1/+/alarm]}
    interfaces:
      - {id: eth0, ip: 10.70.1.10/24}
    routes:
      - {prefix: 10.71.0.0/24, via: 10.70.1.1, name: the cell}
  - id: pgw
    label: pgw (protocol gateway)
    type: system
    kind: other
    kind_label: Industrial protocol gateway
    purpose: l3_forwarder
    icon: protocol_gateway
    group: cell
    interfaces:
      - {id: it0, ip: 10.70.1.1/24}
      - {id: ot0, ip: 10.71.0.1/24}
  - id: tap
    label: tap-1
    type: system
    kind: other
    kind_label: Network TAP
    purpose: pass_through
    icon: tap
    group: cell
    port_pairs:
      - {a: net-a, b: net-b, copy: [mon]}
    interfaces: [net-a, net-b, mon]
  - id: ids
    label: ids-1 (sensor)
    type: ids_ips
    mode: passive
    group: cell
    interfaces:
      - {id: mon0, description: receives the TAP's copy}
  - id: cell-sw
    type: switch
    kind: industrial
    role: access
    group: cell
    igmp_mld_snooping: {1: enabled}
    interfaces:
      - {id: p1, vlans: 1}
      - {id: p2, vlans: 1}
      - {id: p3, vlans: 1}
      - {id: p4, vlans: 1}
  - id: plc
    label: plc-1
    type: endpoint
    kind: plc
    group: cell
    services:
      applications:
        - {id: registers, name: Modbus TCP registers, profile: tcp_server, port: 502}
        - {id: web, name: Web configuration, profile: tcp_server, port: 443}
        - {id: telemetry, name: Telemetry, profile: mqtt_client, broker: edge, publish: [plant/cell1/plc-1/temperature, plant/cell1/plc-1/pressure], qos: "1", interval: 5s}
    interfaces:
      - {id: eth0, ip: 10.71.0.10/24}
    routes:
      - {prefix: 10.70.1.0/24, via: 10.71.0.1, name: engineering}
  - id: hmi
    label: hmi-1
    type: endpoint
    kind: hmi
    group: cell
    services:
      applications:
        - {id: poll, name: Register polling, profile: tcp_client, peer: plc/registers, interval: 2s}
        - {id: dashboard, name: Temperatures, profile: mqtt_client, broker: edge, subscribe: [plant/cell1/+/temperature], qos: "1"}
    interfaces:
      - {id: eth0, ip: 10.71.0.20/24}
  - id: edge
    label: edge-1 (MQTT broker)
    type: server
    kind: appliance
    group: cell
    services:
      mqtt_broker: {}
    interfaces:
      - {id: eth0, ip: 10.71.0.30/24}
    routes:
      - {prefix: 10.70.1.0/24, via: 10.71.0.1, name: engineering}

links:
  - {id: l-eng, a: "eng-ws:eth0", b: "pgw:it0", speed: 1G}
  - {id: l-pgw-tap, a: "pgw:ot0", b: "tap:net-a", speed: 100M}
  - {id: l-tap-sw, a: "tap:net-b", b: "cell-sw:p1", speed: 100M}
  - {id: l-tap-ids, a: "tap:mon", b: "ids:mon0", speed: 100M, direction: unidirectional, label: copy}
  - {id: l-plc, a: "cell-sw:p2", b: "plc:eth0", speed: 100M}
  - {id: l-hmi, a: "cell-sw:p3", b: "hmi:eth0", speed: 100M}
  - {id: l-edge, a: "cell-sw:p4", b: "edge:eth0", speed: 100M}

relations:
  - id: eng-plc
    protocol: https
    label: PLC web configuration
    endpoints: [eng-ws, plc]
    direction: unidirectional
