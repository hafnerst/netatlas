# netatlas example: examples/minimal.yaml after being imported and edited
# (generated by scripts/make-editor-examples.mjs): loopbacks with IPv4 + IPv6,
# r1 renamed to edge-1 (references updated), cable attributes and an iBGP
# session between the loopbacks. Original comments are preserved.
# netatlas example: the smallest useful file.
# Two routers, one cable, one GRE tunnel with an OSPF adjacency inside it.
netatlas: 1
title: Minimal example (edited in netatlas)

devices:
  - id: edge-1
    type: router
    interfaces:
      - {id: eth0, ip: 192.0.2.1/30}
    logical_interfaces:
      - {id: tun0, type: tunnel, source: eth0, destination: r2:eth0}
      - {id: lo0, type: loopback, label: Router ID, ip: [10.255.0.1/32, 2001:db8:ffff::1/128]}
  - id: r2
    type: router
    interfaces:
      - {id: eth0, ip: 192.0.2.2/30}
    logical_interfaces:
      - {id: tun0, type: tunnel, source: eth0, destination: edge-1:eth0}
      - {id: lo0, type: loopback, label: Router ID, ip: [10.255.0.2/32, 2001:db8:ffff::2/128]}

links:
  - id: cable-1
    a: edge-1:eth0
    b: r2:eth0
    medium: copper
    speed: 1G
    attrs:
      patch-panel: PP-3 port 14
      length: 2m

relations:
  - id: gre-1
    protocol: gre
    endpoints: [edge-1:tun0, r2:tun0]
    over: cable-1
  - id: ospf-1
    protocol: ospf
    endpoints: [edge-1:tun0, r2:tun0]
    over: gre-1
  - id: bgp-1
    protocol: ibgp
    endpoints: [edge-1:lo0, r2:lo0]
    over: ospf-1
    attrs:
      asn: 65001
      update-source: lo0

layout:
  physical:
    edge-1: [75, 27]
    r2: [336, 27]
  logical:
    edge-1: [97, 37]
    r2: [441, 37]
