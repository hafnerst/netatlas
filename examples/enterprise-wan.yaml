# netatlas example: enterprise WAN
#
# Headquarters with redundant edge routers and two branches. The same physical
# internet uplinks carry several logical layers:
#   IPsec (encryption)  ->  GRE (tunnel)  ->  OSPF (routing adjacency)
# plus eBGP to two ISPs, a WireGuard backup tunnel over LTE, VRRP, LACP,
# syslog, and a custom protocol (MACsec) defined in the "protocols" section.
# The Hamburg LTE uplink obtains its address by DHCP ("ipv4: dhcp"), and a
# few devices have DNS names ("dns_names"), each associated with interfaces.
netatlas: 1
title: Enterprise WAN — HQ and two branches over VPN
description: |
  HQ Berlin with dual ISPs; branches Munich and Hamburg reach HQ over
  GRE-over-IPsec tunnels across the public internet.

protocols:
  - id: macsec
    label: MACsec
    category: other
    color: "#2b8a3e"
    style: solid
    description: IEEE 802.1AE hop-by-hop link encryption

groups:
  - id: providers
    label: Service providers
    kind: provider
  - id: hq
    label: HQ Berlin
    kind: site
    attrs:
      address: Alexanderplatz 1, Berlin
  - id: hq-edge
    label: Edge rack E1
    kind: rack
    parent: hq
  - id: hq-core
    label: Core rack C1
    kind: rack
    parent: hq
  - id: branch-muc
    label: Branch Munich
    kind: site
  - id: branch-ham
    label: Branch Hamburg
    kind: site

devices:
  - id: inet
    label: Internet
    type: cloud

  - id: isp1-pe
    label: ISP-1 PE
    type: router
    group: providers
    protocols:
      bfd: {}
      bgp: {asn: 3320}
    interfaces:
      - {id: xe-1/0/0}
      - {id: xe-1/0/1}
  - id: isp2-pe
    label: ISP-2 PE
    type: router
    group: providers
    protocols:
      bgp: {asn: 1299}
    interfaces:
      - {id: xe-2/0/0}
      - {id: xe-2/0/7}

  - id: hq-rtr1
    label: hq-rtr1
    type: router
    group: hq-edge
    router_id: lo0
    protocols:
      bfd: {}
      bgp: {asn: 65010}
      ospf: {}
    interfaces:
      - {id: ge-0/0/0, ip: 198.51.100.2/30, mtu: 1500, description: ISP-1 uplink}
      - {id: ge-0/0/1, ip: 10.0.0.2/28}
    logical_interfaces:
      - {id: lo0, type: loopback, ip: 10.255.0.1/32}
      - {id: st0.10, type: tunnel, ip: 172.16.10.1/30, mtu: 1400, source: ge-0/0/0, destination: 192.0.2.10, description: GRE to Munich}
    dns_names:
      - {name: vpn1.acme.example, interfaces: [ge-0/0/0]}
      - {name: hq-rtr1.acme.example, interfaces: [lo0, ge-0/0/1]}   # one name, two interfaces
  - id: hq-rtr2
    label: hq-rtr2
    type: router
    group: hq-edge
    router_id: lo0
    protocols:
      bgp: {asn: 65010}
      ospf: {}
    interfaces:
      - {id: ge-0/0/0, ip: 203.0.113.2/30, mtu: 1500, description: ISP-2 uplink}
      - {id: ge-0/0/1, ip: 10.0.0.3/28}
    logical_interfaces:
      - {id: lo0, type: loopback, ip: 10.255.0.2/32}
      - {id: st0.11, type: tunnel, ip: 172.16.11.1/30, mtu: 1400, source: ge-0/0/0, destination: 192.0.2.34, description: GRE to Hamburg}
      - {id: wg0, type: tunnel, ip: 172.16.99.1/30, source: ge-0/0/0, destination: ham-rtr:wan1}
    routes:
      # the Hamburg tunnel endpoint stays on the ISP-2 uplink (else OSPF would learn it over the backup tunnel)
      - {prefix: 192.0.2.34/32, interface: ge-0/0/0, name: Hamburg tunnel endpoint}
  - id: hq-fw
    label: hq-fw
    type: firewall
    group: hq-edge
    router_id: 10.255.0.3
    protocols:
      ospf: {}
    interfaces:
      - {id: eth1, vlans: 5}
      - {id: eth2, vlans: 5}
      - {id: eth3, ip: 10.0.1.1/30}
      - {id: eth4, ip: 10.0.1.5/30}
    logical_interfaces:
      - {id: vlan5, type: virtual, vlan: 5, ip: 10.0.0.1/28, description: transit to both edge routers (eth1 and eth2)}
  - id: hq-core1
    label: hq-core1
    type: switch
    role: core
    layer3: true
    group: hq-core
    router_id: 10.255.0.11
    protocols:
      ospf: {}
      vrrp: {}
    igmp_mld_snooping: {10: enabled, 20: enabled}
    interfaces:
      - {id: Ethernet49, routed: true, ip: 10.0.1.2/30}
      - {id: Ethernet51}
      - {id: Ethernet52}
      - {id: Ethernet1, vlans: [10, 20]}
    logical_interfaces:
      - {id: Port-Channel1, type: virtual, members: [Ethernet51, Ethernet52], vlans: [10, 20]}
      - id: Vlan10
        type: virtual
        ip: 10.10.10.2/24
        protocols:
          vrrp: {group: 10, virtual_ip: 10.10.10.1, priority: 200}
      - id: Vlan20
        type: virtual
        ip: 10.10.20.2/24
        protocols:
          vrrp: {group: 20, virtual_ip: 10.10.20.1, priority: 200}
  - id: hq-core2
    label: hq-core2
    type: switch
    role: core
    layer3: true
    group: hq-core
    router_id: 10.255.0.12
    protocols:
      ospf: {}
      vrrp: {}
    igmp_mld_snooping: {10: enabled, 20: enabled}
    interfaces:
      - {id: Ethernet49, routed: true, ip: 10.0.1.6/30}
      - {id: Ethernet51}
      - {id: Ethernet52}
      - {id: Ethernet1, vlans: [10, 20]}
    logical_interfaces:
      - {id: Port-Channel1, type: virtual, members: [Ethernet51, Ethernet52], vlans: [10, 20]}
      - id: Vlan10
        type: virtual
        ip: 10.10.10.3/24
        protocols:
          vrrp: {group: 10, virtual_ip: 10.10.10.1, priority: 100}
      - id: Vlan20
        type: virtual
        ip: 10.10.20.3/24
        protocols:
          vrrp: {group: 20, virtual_ip: 10.10.20.1, priority: 100}
  - id: hq-acc1
    label: hq-acc1
    type: switch
    group: hq-core
    igmp_mld_snooping: {10: enabled, 20: enabled}
    interfaces:
      - {id: Gi1/0/49, vlans: [10, 20]}
      - {id: Gi1/0/50, vlans: [10, 20]}
      - {id: Gi1/0/1, vlans: 20}
    logical_interfaces:
      - {id: Vlan10, type: virtual, ip: 10.10.10.4/24, description: Switch management}
  - id: hq-log
    label: hq-log (syslog)
    type: server
    group: hq-core
    interfaces:
      - {id: eno1, ip: 10.10.20.50/24}
    routes:
      - {prefix: 0.0.0.0/0, via: 10.10.20.1, name: default gateway (VRRP)}
    dns_names:
      - {name: syslog.acme.example, interfaces: [eno1]}

  - id: muc-rtr
    label: muc-rtr
    type: router
    group: branch-muc
    router_id: 10.255.1.1
    protocols:
      ospf: {}
    interfaces:
      - {id: wan0, ip: 192.0.2.10/29, description: VDSL}
      - {id: lan0, ip: 10.20.0.1/24}
    logical_interfaces:
      - {id: Tunnel10, type: tunnel, ip: 172.16.10.2/30, mtu: 1400, source: wan0, destination: 198.51.100.2}
  - id: muc-sw
    label: muc-sw
    type: switch
    group: branch-muc
    igmp_mld_snooping: {1: enabled}
    interfaces: [{id: gi1, vlans: 1}, {id: gi8, vlans: 1}]
  - id: muc-ap
    label: muc-ap
    type: ap
    group: branch-muc
    services:
      wireless:
        networks:
          - {id: staff, ssid: MUC-Staff, untagged: true, radio: wlan0, security: wpa2_enterprise}
    interfaces:
      - {id: eth0, ip: 10.20.0.10/24}
      - {id: wlan0}

  - id: ham-rtr
    label: ham-rtr
    type: router
    group: branch-ham
    router_id: 10.255.2.1
    protocols:
      ospf: {}
    interfaces:
      - {id: wan0, ip: 192.0.2.34/29}
      - {id: wan1, ipv4: dhcp, description: LTE backup modem}   # address assigned by the carrier
      - {id: lan0, ip: 10.30.0.1/24}
    logical_interfaces:
      - {id: Tunnel11, type: tunnel, ip: 172.16.11.2/30, source: wan0, destination: 203.0.113.2}
      - {id: wg0, type: tunnel, ip: 172.16.99.2/30, source: wan1, destination: 203.0.113.2}
    routes:
      # the tunnel endpoint at HQ stays on the internet uplink (else OSPF would learn it over the backup tunnel itself)
      - {prefix: 203.0.113.2/32, interface: wan0, name: HQ tunnel endpoint}
  - id: ham-sw
    label: ham-sw
    type: switch
    group: branch-ham
    igmp_mld_snooping: {1: enabled}
    interfaces: [{id: gi1, vlans: 1}, {id: gi2, vlans: 1}]

links:
  # provider side
  - {id: l-isp1-inet, a: "isp1-pe:xe-1/0/0", b: inet, medium: fiber, speed: 10G, label: AS3320 transit}
  - {id: l-isp2-inet, a: "isp2-pe:xe-2/0/0", b: inet, medium: fiber, speed: 10G, label: AS1299 transit}
  - id: l-hq-isp1
    a: "hq-rtr1:ge-0/0/0"
    b: "isp1-pe:xe-1/0/1"
    medium: fiber
    speed: 1G
    cable: CID-4711
  - id: l-hq-isp2
    a: "hq-rtr2:ge-0/0/0"
    b: "isp2-pe:xe-2/0/7"
    medium: fiber
    speed: 1G
    cable: CID-0815
  - {id: l-muc-inet, a: "muc-rtr:wan0", b: inet, medium: copper, speed: 250M, label: VDSL 250M}
  - {id: l-ham-inet, a: "ham-rtr:wan0", b: inet, medium: fiber, speed: 1G, label: FTTH}
  - {id: l-ham-lte, a: "ham-rtr:wan1", b: inet, medium: lte, speed: 150M, label: LTE backup}
  # HQ (the core/access cables are trunks: each end lists the VLANs it permits)
  - {id: l-rtr1-fw, a: "hq-rtr1:ge-0/0/1", b: hq-fw:eth1, medium: copper, speed: 1G}
  - {id: l-rtr2-fw, a: "hq-rtr2:ge-0/0/1", b: hq-fw:eth2, medium: copper, speed: 1G}
  - {id: l-fw-core1, a: "hq-fw:eth3", b: "hq-core1:Ethernet49", medium: fiber, speed: 10G}
  - {id: l-fw-core2, a: "hq-fw:eth4", b: "hq-core2:Ethernet49", medium: fiber, speed: 10G}
  - id: l-peer1
    a: hq-core1:Ethernet51
    b: hq-core2:Ethernet51
    medium: dac
    speed: 100G
    cable: DAC 1m
  - id: l-peer2
    a: hq-core1:Ethernet52
    b: hq-core2:Ethernet52
    medium: dac
    speed: 100G
    cable: DAC 1m
  - id: l-core1-acc
    a: hq-core1:Ethernet1
    b: hq-acc1:Gi1/0/49
    medium: fiber
    speed: 10G
  - id: l-core2-acc
    a: hq-core2:Ethernet1
    b: hq-acc1:Gi1/0/50
    medium: fiber
    speed: 10G
  - id: l-acc-log
    a: hq-acc1:Gi1/0/1
    b: "hq-log:eno1"
    medium: copper
    speed: 1G
  # branches
  - {id: l-muc-sw, a: "muc-rtr:lan0", b: "muc-sw:gi1", medium: copper, speed: 1G}
  - {id: l-muc-ap, a: "muc-sw:gi8", b: "muc-ap:eth0", medium: copper, speed: 1G, label: PoE+}
  - {id: l-ham-sw, a: "ham-rtr:lan0", b: "ham-sw:gi1", medium: copper, speed: 1G}

networks:
  # IP networks, one prefix each. Members are not listed: every device with an
  # interface or loopback address inside "cidr" is a member. "vlan" is the VLAN
  # the subnet lives in; interfaces with an address in it show that VLAN.
  # Which cables carry a network follows from the VLANs of their ports
  # ("vlans" on the interfaces): a port in VLAN 10 carries net-users.
  - id: net-transit
    label: HQ transit
    cidr: 10.0.0.0/28
    vlan: 5
  - id: net-users
    label: Users
    cidr: 10.10.10.0/24
    vlan: 10
  - id: net-servers
    label: Servers
    cidr: 10.10.20.0/24
    vlan: 20
  - id: net-muc-lan
    label: Munich LAN
    cidr: 10.20.0.0/24
  - id: net-ham-lan
    label: Hamburg LAN
    cidr: 10.30.0.0/24

relations:
  # --- Munich: IPsec carries GRE carries OSPF -----------------------------
  - id: ipsec-muc
    protocol: ipsec
    label: IKEv2 site-to-site
    endpoints: ["hq-rtr1:ge-0/0/0", "muc-rtr:wan0"]
    over: [l-hq-isp1, l-isp1-inet, l-muc-inet]
    attrs:
      ike: v2
      encryption: aes-256-gcm
      dh-group: 20
      lifetime: 8h
  - id: gre-muc
    protocol: gre
    endpoints: ["hq-rtr1:st0.10", "muc-rtr:Tunnel10"]
    over: ipsec-muc
    attrs: {key: 10, keepalive: "10 3"}
  - id: ospf-muc
    protocol: ospf
    endpoints: ["hq-rtr1:st0.10", "muc-rtr:Tunnel10"]
    over: gre-muc
    attrs: {area: 0.0.0.1, cost: 100, network-type: point-to-point}

  # --- Hamburg: same stack via ISP-2, plus a WireGuard backup over LTE ------
  - id: ipsec-ham
    protocol: ipsec
    endpoints: ["hq-rtr2:ge-0/0/0", "ham-rtr:wan0"]
    over: [l-hq-isp2, l-isp2-inet, l-ham-inet]
    attrs: {ike: v2, encryption: aes-256-gcm}
  - id: gre-ham
    protocol: gre
    endpoints: ["hq-rtr2:st0.11", "ham-rtr:Tunnel11"]
    over: ipsec-ham
    attrs: {key: 11}
  - id: ospf-ham
    protocol: ospf
    endpoints: ["hq-rtr2:st0.11", "ham-rtr:Tunnel11"]
    over: gre-ham
    attrs: {area: 0.0.0.2, cost: 100}
  - id: wg-ham-backup
    protocol: wireguard
    label: LTE backup
    endpoints: ["hq-rtr2:wg0", "ham-rtr:wg0"]
    over: [l-ham-lte, l-isp2-inet, l-hq-isp2]
    attrs: {listen-port: 51820, persistent-keepalive: 25}
  - id: ospf-ham-backup
    protocol: ospf
    endpoints: ["hq-rtr2:wg0", "ham-rtr:wg0"]
    over: wg-ham-backup
    attrs: {area: 0.0.0.2, cost: 1000}

  # --- Internet edge ---------------------------------------------------------
  - id: bgp-isp1
    protocol: ebgp
    endpoints: ["hq-rtr1:ge-0/0/0", "isp1-pe:xe-1/0/1"]
    over: l-hq-isp1
    attrs: {prefixes-out: 1, max-prefix: 1000000}
  - id: bgp-isp2
    protocol: ebgp
    endpoints: ["hq-rtr2:ge-0/0/0", "isp2-pe:xe-2/0/7"]
    over: l-hq-isp2
  - id: ibgp-hq
    protocol: ibgp
    endpoints: ["hq-rtr1:lo0", "hq-rtr2:lo0"]
    over: net-transit
  - id: bfd-isp1
    protocol: bfd
    endpoints: ["hq-rtr1:ge-0/0/0", "isp1-pe:xe-1/0/1"]
    over: l-hq-isp1
    attrs: {interval: 300ms, multiplier: 3}

  # --- HQ campus ------------------------------------------------------------
  - id: ospf-hq-area0
    protocol: ospf
    label: area 0
    endpoints: [hq-rtr1, hq-rtr2, hq-fw, hq-core1, hq-core2]
    over: net-transit
    attrs: {area: 0.0.0.0}
  - id: lag-peer
    protocol: lacp
    label: Po1 peer-link
    endpoints: ["hq-core1:Port-Channel1", "hq-core2:Port-Channel1"]
    over: [l-peer1, l-peer2]
    attrs: {mode: active, members: 2}
  - id: macsec-peer
    protocol: macsec
    endpoints: ["hq-core1:Ethernet51", "hq-core2:Ethernet51"]
    over: l-peer1
    attrs: {cipher: GCM-AES-XPN-256}
  - id: vrrp-users
    protocol: vrrp
    label: VIP 10.10.10.1
    endpoints: ["hq-core1:Vlan10", "hq-core2:Vlan10"]
    over: net-users
  - id: vrrp-servers
    protocol: vrrp
    label: VIP 10.10.20.1
    endpoints: ["hq-core1:Vlan20", "hq-core2:Vlan20"]
    over: net-servers
  - id: syslog-fw
    protocol: syslog
    direction: unidirectional
    endpoints: [hq-fw, "hq-log:eno1"]
    attrs: {transport: tcp/6514, format: RFC5424}
  - id: twamp-muc
    protocol: twamp
    category: service
    label: SLA probe
    direction: unidirectional
    endpoints: [muc-rtr, hq-rtr1]

# Design checks (Analyze ▾ → Design checks…): the firewall must log to the
# log server (syslog, UDP 514 as the profile has it), also without HQ rack A
# (one of the two core switches: the equal-cost path over the other
# remains), and Munich must not open SSH to the log server (the firewall
# permits what the relations through it name). Single points of failure →
# What if… the HQ core room: both core switches fail together, and the
# firewall's logging becomes unavailable.
failure_domains:
  - {id: hq-rack-a, label: HQ rack A, kind: rack, members: [hq-core1]}
  - {id: hq-core-room, label: HQ core room, kind: room, members: [hq-core1, hq-core2]}

expectations:
  - {id: fw-logs, name: The firewall logs to the log server, expect: available, from: hq-fw, to: hq-log, service: udp/514}
  - id: fw-logs-rack-a
    name: The firewall logs without rack A
    expect: available
    from: hq-fw
    to: hq-log
    service: udp/514
    failure: [hq-rack-a]
  - id: muc-no-ssh
    name: Munich can't open SSH to the log server
    expect: blocked
    from: "muc-rtr:lan0"
    to: hq-log
    service: tcp/22
