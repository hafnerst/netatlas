# netatlas example: every device type
#
# A small campus that uses each of the 15 device types once or more:
# cloud, router, vpn_gateway, firewall, ids_ips, load_balancer,
# security_gateway, switch, ap, endpoint, server, vm, container, storage
# and system.
netatlas: 1
title: Campus — all device types
description: |
  Internet edge with a remote-access VPN gateway, firewall and inline IPS; a
  DMZ with a load balancer and a web proxy server; core and access switching
  with Wi-Fi; a server room with a virtualisation host, a monitoring
  appliance and a NAS behind a Security gateway (a filtering bridge).

groups:
  - id: providers
    label: Internet
    kind: provider
  - id: campus
    label: Campus
    kind: campus
  - id: dmz
    label: DMZ
    kind: zone
    parent: campus
  - id: office
    label: Office floor 1
    kind: room
    parent: campus
  - id: server-room
    label: Server room
    kind: room
    parent: campus

devices:
  - id: isp
    label: ISP
    type: cloud
    group: providers
    interfaces: [edge, vpn]
  - id: edge
    label: edge-rtr
    type: router
    role: border
    group: campus
    router_id: lo0
    protocols:
      bgp: {asn: 64500}
    interfaces:
      - {id: wan0, ip: 198.51.100.2/30}
      - {id: lan0, ip: 10.0.0.1/30}
    logical_interfaces:
      - {id: lo0, type: loopback, ip: 10.255.0.1/32}
  - id: vpn-gw
    label: vpn-gw
    type: vpn_gateway
    role: border
    group: campus
    services:
      vpn:
        operation: remote_access
        technology: ipsec
        listener: wan0
        pool: 10.250.0.0/24
        protected: [10.0.0.0/16]
    interfaces:
      - {id: wan0, ip: 198.51.100.6/30}
      - {id: lan0, ip: 10.0.0.5/30}
    routes:
      - {prefix: 10.0.0.0/16, via: 10.0.0.6, name: the campus via the firewall}
  - id: fw
    label: fw1
    type: firewall
    kind: ngfw
    group: campus
    interfaces:
      - {id: outside, ip: 10.0.0.2/30}
      - {id: vpn, ip: 10.0.0.6/30}
      - {id: inside}
      - {id: dmz1}
      - {id: dmz2}
    routes:
      - {prefix: 0.0.0.0/0, via: 10.0.0.1, name: default via the edge router}
  - id: ips
    label: ips1
    type: ids_ips
    mode: inline
    group: campus
    port_pairs:
      - {a: in, b: out}
    interfaces:
      - {id: in}
      - {id: out}
  - id: lb
    label: lb1
    type: load_balancer
    group: dmz
    tier: 3
    interfaces:
      - {id: eth0}
  - id: proxy
    label: proxy1
    type: server
    role: dmz
    group: dmz
    tier: 3
    interfaces:
      - {id: eth0}
  - id: core
    label: core-sw
    type: switch
    role: core
    group: campus
    igmp_mld_snooping: {1: enabled}
    interfaces:
      - {id: Et1, vlans: 1}
      - {id: Et2, vlans: 1}
      - {id: Et3, vlans: 1}
      - {id: Et4, vlans: 1}
      - {id: Et5, vlans: 1}
  - id: access
    label: acc-sw1
    type: switch
    role: access
    group: office
    igmp_mld_snooping: {1: enabled}
    interfaces:
      - {id: Et49, vlans: 1}
      - {id: Et1, vlans: 1}
      - {id: Et2, vlans: 1}
      # free ports: no cable yet (the physical view shows them as chips in the switch)
      - {id: Et3, vlans: 1}
      - {id: Et4, vlans: 1}
      - {id: Et5, vlans: 1}
      - {id: Et6, vlans: 1}
      - {id: Et7, vlans: 1}
      - {id: Et8, vlans: 1}
  - id: ap
    label: ap-1-01
    type: ap
    group: office
    services:
      wireless:
        networks:
          - {id: office, ssid: Office, untagged: true, radio: wlan0, security: wpa3_enterprise}
    interfaces:
      - {id: eth0}
      - {id: wlan0}
  - id: laptop
    label: laptop-042
    type: endpoint
    group: office
    interfaces:
      - {id: wlan0}
  - id: desktop
    label: pc-017
    type: endpoint
    group: office
    interfaces:
      - {id: eth0}
  # a server with the Hypervisor service runs app-vm; app-vm's Container engine runs api
  - id: host
    label: esx-01
    type: server
    group: server-room
    services:
      hypervisor:
        platform: esxi
        vswitches:
          - {name: vSwitch0, type: standard, uplinks: [vmnic0], teaming: active_standby, port_groups: [{name: VM Network, vlans: 1}]}
    interfaces:
      - {id: vmnic0}
  - id: app-vm
    label: app-vm
    type: vm
    host: host
    services:
      container_engine:
        engine: docker
        networks:
          - {name: bridge, driver: bridge, interface: docker0, subnet: 172.17.0.0/16, gateway: 172.17.0.1, nat: true}
    logical_interfaces:
      - {id: eth0, type: vnic, port_group: VM Network}
  - id: api
    label: api
    type: container
    host: app-vm
    logical_interfaces:
      - {id: eth0, type: veth, network: bridge}
  # the NAS sits behind a filtering bridge: only NFS from the server room reaches it
  - id: sep
    label: sep-nas
    type: security_gateway
    group: server-room
    services:
      separation:
        implementation: filtering_bridge
        domains:
          - {name: Campus, interfaces: [p1]}
          - {name: Storage, interfaces: [p2]}
        directions:
          - {from: Campus, to: Storage}
        rules:
          - id: nfs
            description: NFS to the NAS
            from: Campus
            to: Storage
            source: 10.0.20.0/24
            destination: 10.0.20.10
            protocol: tcp
            ports: "2049"
    management: [mgmt0]
    interfaces:
      - {id: p1}
      - {id: p2}
      - {id: mgmt0}
  - id: nas
    label: nas-01
    type: storage
    group: server-room
    tier: 4
    interfaces:
      - {id: eth0, ip: 10.0.20.10/24}
  - id: nms
    label: nms
    type: system
    kind: other
    kind_label: Monitoring appliance
    role: management
    purpose: host
    group: server-room
    interfaces:
      - {id: eth0}

links:
  - {id: l-isp-edge, a: "isp:edge", b: "edge:wan0", medium: fiber, speed: 1G}
  - {id: l-isp-vpn, a: "isp:vpn", b: "vpn-gw:wan0", medium: fiber, speed: 1G}
  - {id: l-edge-fw, a: "edge:lan0", b: "fw:outside", speed: 1G}
  - {id: l-vpn-fw, a: "vpn-gw:lan0", b: "fw:vpn", speed: 1G}
  - {id: l-fw-ips, a: "fw:inside", b: "ips:in", speed: 10G}
  - {id: l-ips-core, a: "ips:out", b: "core:Et1", speed: 10G}
  - {id: l-fw-lb, a: "fw:dmz1", b: "lb:eth0", speed: 1G}
  - {id: l-fw-proxy, a: "fw:dmz2", b: "proxy:eth0", speed: 1G}
  - {id: l-core-access, a: "core:Et2", b: "access:Et49", medium: fiber, speed: 10G}
  - {id: l-access-ap, a: "access:Et1", b: "ap:eth0", speed: 1G}
  - {id: l-access-pc, a: "access:Et2", b: "desktop:eth0", speed: 1G}
  - {id: l-wifi, a: "ap:wlan0", b: "laptop:wlan0", medium: wireless, wireless_network: office}
  - {id: l-core-host, a: "core:Et3", b: "host:vmnic0", medium: dac, speed: 10G}
  - {id: l-core-sep, a: "core:Et4", b: "sep:p1", medium: dac, speed: 10G}
  - {id: l-sep-nas, a: "sep:p2", b: "nas:eth0", medium: dac, speed: 10G}
  - {id: l-core-nms, a: "core:Et5", b: "nms:eth0", speed: 1G}

relations:
  - id: ebgp-isp
    protocol: ebgp
    endpoints: [edge, isp]
    over: l-isp-edge
  - id: ipsec-remote
    protocol: ipsec
    label: remote-access VPN
    endpoints: [vpn-gw, isp]
    over: l-isp-vpn
  - id: https-lb-api
    protocol: https
    label: published API
    endpoints: [lb, api]
    direction: unidirectional
  - id: proxy-out
    protocol: https
    label: outbound web
    endpoints: [proxy, isp]
    direction: unidirectional
  - id: snmp-core
    protocol: snmp
    endpoints: [nms, core]
    direction: unidirectional
  - id: syslog-fw
    protocol: syslog
    endpoints: [fw, nms]
    direction: unidirectional
  - id: nfs
    protocol: nfs
    category: other
    label: NFS datastore
    endpoints: [host, nas]
