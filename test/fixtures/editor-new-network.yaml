# netatlas test fixture: a model created with "New" in the editor and built up
# with the editor operations (generated by scripts/make-fixtures.mjs).
netatlas: 1
title: "Lab: two edge routers"
description: "Created in the netatlas editor: loopbacks, ports, a VLAN interface and a tunnel interface per router, one cable, IP networks, iBGP and a GRE tunnel between loopbacks."
devices:
  - id: edge-a
    type: router
    interfaces:
      - {id: ge-0/0/0, ip: [192.0.2.1/31]}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.255.0.1/32]}
      - {id: lo1, type: loopback, label: BGP source (IPv6), ip: [2001:db8:ffff::a/128]}
      - {id: irb.100, type: virtual, label: Management, ip: [10.100.0.1/24]}
      - {id: gr-0/0/0.1, type: tunnel, ip: [172.16.0.1/30], source: lo0, destination: 10.255.0.2}
  - id: edge-b
    label: Edge B
    type: router
    interfaces:
      - {id: ge-0/0/0, ip: [192.0.2.0/31]}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.255.0.2/32, 2001:db8:ffff::2/128]}
      - {id: lo1, type: loopback, label: BGP source (IPv6), ip: [2001:db8:ffff::b/128]}
      - {id: irb.100, type: virtual, label: Management, ip: [10.100.0.2/24]}
      - {id: gr-0/0/0.1, type: tunnel, ip: [172.16.0.2/30], source: lo0, destination: 10.255.0.1}
links:
  - id: cable-1
    a: {device: edge-a, interface: ge-0/0/0, vlans: [100]}
    b: {device: edge-b, interface: ge-0/0/0, vlans: [100]}
    medium: fiber
    speed: 10G
    cable: LC-LC OM4 3m
networks:
  - id: net-core
    label: Core link
    cidr: 192.0.2.0/31
  - id: net-mgmt
    label: Management
    cidr: 10.100.0.0/24
    vlan: 100
  - id: net-loopbacks
    label: Router loopbacks
    cidr: 10.255.0.0/24
relations:
  - id: ibgp-v6
    protocol: ibgp
    endpoints: [edge-a:lo1, edge-b:lo1]
    over: cable-1
    attrs:
      asn: 65000
      address-family: [ipv6-unicast, evpn]
  - id: gre-lab
    protocol: gre
    endpoints: [edge-a:lo0, edge-b:lo0]
    over: cable-1
    attrs:
      key: 100
      keepalive:
        interval: 10s
        retries: 3

layout:
  physical:
    edge-a: [75, 27]
    edge-b: [449, 27]
  logical:
    edge-a: [88, 327]
    edge-b: [424, 288]
    net-core: [97, 573]
    net-loopbacks: [500, 497]
    net-mgmt: [202, 21]
