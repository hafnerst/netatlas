# netatlas test fixture: a model created with "New" in the editor and built up
# with the editor operations (generated by scripts/make-fixtures.mjs).
netatlas: 2
title: "Lab: two edge routers"
description: "Created in the netatlas editor: loopbacks, ports, a subinterface and a tunnel interface per router, one cable, IP networks, iBGP and a GRE tunnel between loopbacks."
devices:
  - id: edge-a
    type: router
    router_id: lo0
    protocols:
      bgp: {asn: 65000}
    interfaces:
      - {id: ge-0/0/0, ip: [192.0.2.1/31]}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.255.0.1/32]}
      - {id: lo1, type: loopback, label: BGP source (IPv6), ip: [2001:db8:ffff::a/128]}
      - {id: ge-0/0/0.100, type: virtual, label: Management, ip: [10.100.0.1/24]}
      - {id: gr-0/0/0.1, type: tunnel, ip: [172.16.0.1/30], source: lo0, destination: 10.255.0.2}
  - id: edge-b
    label: Edge B
    type: router
    router_id: lo0
    protocols:
      bgp: {asn: 65000}
    interfaces:
      - {id: ge-0/0/0, ip: [192.0.2.0/31]}
    logical_interfaces:
      - {id: lo0, type: loopback, label: Router ID, ip: [10.255.0.2/32, 2001:db8:ffff::2/128]}
      - {id: lo1, type: loopback, label: BGP source (IPv6), ip: [2001:db8:ffff::b/128]}
      - {id: ge-0/0/0.100, type: virtual, label: Management, ip: [10.100.0.2/24]}
      - {id: gr-0/0/0.1, type: tunnel, ip: [172.16.0.2/30], source: lo0, destination: 10.255.0.1}
links:
  - {id: cable-1, a: edge-a:ge-0/0/0, b: edge-b:ge-0/0/0, medium: fiber, speed: 10G, cable: LC-LC OM4 3m}
networks:
  - id: net-core
    label: Core link
    cidr: 192.0.2.0/31
  - id: net-mgmt
    label: Management
    cidr: 10.100.0.0/24
    vlan: 100
  - id: net-loopbacks
    label: Router loopbacks
    cidr: 10.255.0.0/24
relations:
  - id: ibgp-v6
    protocol: ibgp
    endpoints: [edge-a:lo1, edge-b:lo1]
    over: cable-1
    attrs:
      address-family: [ipv6-unicast, evpn]
  - id: gre-lab
    protocol: gre
    endpoints: [edge-a:lo0, edge-b:lo0]
    over: cable-1
    attrs:
      key: 100
      keepalive:
        interval: 10s
        retries: 3

layout:
  physical:
    edge-a: [75, 65]
    edge-b: [491, 65]
  logical:
    edge-a: [456, 309]
    edge-b: [91, 350]
    net-core: [117, 611]
    net-loopbacks: [512, 562]
    net-mgmt: [226, 21]
